name: Khaos (Agent Eval)

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  khaos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Keep local artifacts inside the workspace (helps self-hosted runner hygiene).
      KHAOS_STATE_DIR: ${{ github.workspace }}/.khaos
      KHAOS_API_URL: ${{ secrets.KHAOS_API_URL }}
      KHAOS_API_TOKEN: ${{ secrets.KHAOS_API_TOKEN }}
      KHAOS_PROJECT_SLUG: ${{ secrets.KHAOS_PROJECT_SLUG }}
      KHAOS_DASHBOARD_URL: ${{ secrets.KHAOS_DASHBOARD_URL }}
      # Recommended split:
      # - Pull requests: quick, low-cost pack
      # - Main branch: thorough pack
      KHAOS_PACK: ${{ github.event_name == 'pull_request' && 'quickstart' || 'full-eval' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Khaos CLI
        run: |
          python -m pip install --upgrade pip
          pip install "khaos>=1.0.0,<2"

      - name: Run evaluation (CI gate)
        id: khaos
        run: |
          # Writes Markdown to $GITHUB_STEP_SUMMARY automatically
          khaos ci path/to/agent.py \
            --pack "$KHAOS_PACK" \
            --sync \
            --exit-code-mode ga \
            --json-file khaos-results.json \
            --format junit \
            --output-file khaos-results.xml
          # To also run @khaostest tests in the same pipeline, add:
          #   --test --test-path tests/

      - name: Export local artifacts (best-effort)
        if: always()
        run: |
          RUN_ID="${{ steps.khaos.outputs.run_id }}"
          if [ -n "$RUN_ID" ]; then
            khaos export "$RUN_ID" --out "khaos-export-${RUN_ID}.json" || true
          fi

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khaos-results
          if-no-files-found: ignore
          path: |
            khaos-results.json
            khaos-results.xml
            khaos-export-*.json
            ${{ steps.khaos.outputs.trace_path }}
            ${{ steps.khaos.outputs.metrics_path }}

      # Optional (self-hosted runners): cleanup local state to avoid disk growth.
      # Note: this may re-upload the run if it wasn't queued.
      # - name: Cleanup local artifacts
      #   if: always()
      #   run: |
      #     RUN_ID="${{ steps.khaos.outputs.run_id }}"
      #     if [ -n "$RUN_ID" ]; then
      #       khaos sync --run "$RUN_ID" --cleanup || true
      #     fi

  khaos-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Khaos CLI
        run: |
          python -m pip install --upgrade pip
          pip install "khaos>=1.0.0,<2"

      - name: Run @khaostest tests
        id: khaos-test
        run: |
          khaos test \
            --format junit \
            --output-file khaos-test-results.xml \
            --json-file khaos-test-results.json

      - name: Upload JUnit Report
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: 'khaos-test-results.xml'
          fail_on_failure: false
          include_passed: true
          check_name: 'Khaos @khaostest Results'

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khaos-test-results
          if-no-files-found: ignore
          path: |
            khaos-test-results.xml
            khaos-test-results.json
