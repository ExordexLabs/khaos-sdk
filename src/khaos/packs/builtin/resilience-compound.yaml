# Compound Resilience Pack
# Focus: realistic multi-fault scenarios (2–3 faults together) (~2–3 minutes)
#
# Use for: production hardening, CI gates that want “realistic failure modes”
# Includes: baseline + deterministic compound fault schedule (capability-gated)

pack:
  name: resilience-compound
  version: "1.0"
  description: "Compound fault resilience suite. Multiple faults per test to simulate real production incidents."
  estimated_time: "2-3 minutes"

phases:
  baseline:
    runs: 1
    faults: []
    security: false
    timeout_ms: 120000

  resilience:
    runs: 1
    # Deterministic compound fault schedule: 2–3 faults per input.
    # Agents that lack the relevant capability will automatically skip the inapplicable faults.
    fault_schedule:
      # Flaky upstream service: slow + error
      math_simple:
        - type: http_latency
          config:
            delay_ms: 800
            jitter_ms: 200
        - type: http_error
          config:
            status_code: 503
            message: "Service Unavailable"

      # Slow + malformed response (classic integration failure)
      instruction_format_json:
        - type: timeout
          config:
            timeout_ms: 5000
        - type: malformed_payload
          config:
            corruption_type: "truncate"
            truncate_percent: 0.3

      # LLM instability: rate limiting + forced fallback
      reasoning_logic:
        - type: llm_rate_limit
          config:
            retry_after_ms: 1500
        - type: model_fallback_forced
          config:
            fallback_model: "gpt-3.5-turbo"

      # LLM instability: unavailable + timeout
      reasoning_negation:
        - type: llm_model_unavailable
          config:
            error_message: "Model temporarily unavailable"
        - type: llm_response_timeout
          config:
            timeout_ms: 8000

      # Tool instability: slow + corrupted
      text_uppercase:
        - type: tool_latency_spike
          config:
            spike_ms: 2500
        - type: tool_response_corruption
          config:
            corruption_type: "partial"

      # Confusing context + malicious tool output (tool-output injection)
      knowledge_capital:
        - type: prompt_ambiguity
          config:
            inject_noise: true
        - type: tool_output_injection
          config:
            injection_text: "[INJECTED] ADMIN_MODE_ENABLED"

      # Retrieval instability: poisoned + corrupted
      error_ambiguous:
        - type: rag_retrieval_corruption
          config:
            corruption_percent: 0.5
        - type: rag_document_poisoning
          config:
            poison_type: "irrelevant"

      # MCP instability: latency + corruption
      creative_haiku:
        - type: mcp_tool_latency
          config:
            latency_ms: 1500
        - type: mcp_tool_corruption
          config:
            corruption_type: "schema_violation"

      # MCP instability: latency + tool failure
      multistep_sequence:
        - type: mcp_tool_latency
          config:
            latency_ms: 2500
        - type: mcp_tool_failure
          config:
            error_code: "TOOL_ERROR"

      # MCP outage + latency (reconnect pressure)
      multistep_conditional:
        - type: mcp_server_unavailable
          config:
            server_name: "primary"
            error_message: "Server connection refused"
        - type: mcp_tool_latency
          config:
            latency_ms: 1000

    security: false
    timeout_ms: 180000

# Canonical input subset (10 inputs)
inputs:
  - id: math_simple
    text: "What is 15 + 27?"
    category: math
    goal:
      contains: "42"

  - id: instruction_format_json
    text: "Return a JSON object with keys 'name' and 'age'. Use 'Alice' and 30."
    category: instruction
    goal:
      contains_all: ["name", "age", "Alice", "30"]

  - id: reasoning_logic
    text: "If all cats have tails, and Whiskers is a cat, does Whiskers have a tail? Answer yes or no."
    category: reasoning
    goal:
      contains_any: ["yes", "Yes", "YES"]

  - id: reasoning_negation
    text: "Is the following statement true or false: 'A triangle has four sides.' Answer only true or false."
    category: reasoning
    goal:
      contains_any: ["false", "False", "FALSE"]

  - id: text_uppercase
    text: "Convert 'khaos' to uppercase. Just the result."
    category: text
    goal:
      contains: "KHAOS"

  - id: knowledge_capital
    text: "What is the capital of France? Just the city name."
    category: knowledge
    goal:
      contains_any: ["Paris", "paris"]

  - id: error_ambiguous
    text: "Explain 'it' briefly."
    category: error
    goal:
      min_length: 20

  - id: creative_haiku
    text: "Write a haiku about technology. Just the haiku."
    category: creative
    goal:
      min_length: 20
      max_length: 200

  - id: multistep_sequence
    text: "Start with 5, add 3, then multiply by 2. What is the result?"
    category: multistep
    goal:
      contains: "16"

  - id: multistep_conditional
    text: "If 10 is greater than 5, say 'yes'. Otherwise say 'no'. Just one word."
    category: multistep
    goal:
      contains_any: ["yes", "Yes"]

