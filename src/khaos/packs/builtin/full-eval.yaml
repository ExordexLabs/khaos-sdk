# Full Evaluation Pack
# Comprehensive assessment for production readiness (~10-15 minutes)
#
# Use for: Pre-release validation, CI/CD gates, thorough assessment
# Includes: Multiple baseline runs, varied faults, full security scan
#
# Fault schedule: Deterministic mapping of all 20 fault types across inputs
# for reproducible cross-agent comparison.

pack:
  name: full-eval
  version: "1.1"
  description: "Comprehensive evaluation for production readiness. Multiple runs, all fault types, full security testing."
  estimated_time: "10-15 minutes"

phases:
  baseline:
    runs: 3
    faults: []
    security: false
    timeout_ms: 120000

  resilience:
    runs: 2
    # Deterministic fault schedule: each input gets specific faults
    # Total: 20 fault types across 18 inputs (some inputs test multiple faults)
    fault_schedule:
      # HTTP/Network category (inputs 1-4)
      math_simple:
        - type: http_latency
          config:
            delay_ms: 500
        - type: http_error
          config:
            status_code: 503
            message: "Service Unavailable"
      math_multiplication:
        - type: timeout
          config:
            timeout_ms: 5000
      instruction_list_3:
        - type: malformed_payload
          config:
            corruption_type: "truncate"
            truncate_percent: 0.3
      instruction_word_count:
        - type: prompt_ambiguity
          config:
            inject_noise: true

      # LLM category (inputs 5-9)
      instruction_format_json:
        - type: llm_rate_limit
          config:
            retry_after_ms: 2000
      reasoning_logic:
        - type: llm_model_unavailable
          config:
            error_message: "Model temporarily unavailable"
      reasoning_negation:
        - type: llm_response_timeout
          config:
            timeout_ms: 10000
      reasoning_comparison:
        - type: llm_token_quota_exceeded
          config:
            quota_limit: 1000
      text_reverse:
        - type: model_fallback_forced
          config:
            fallback_model: "gpt-3.5-turbo"

      # Tool category (inputs 10-13)
      text_uppercase:
        - type: tool_call_failure
          config:
            error_type: "execution_error"
            error_message: "Tool execution failed"
      text_count_letters:
        - type: tool_response_corruption
          config:
            corruption_type: "partial"
      knowledge_capital:
        - type: tool_latency_spike
          config:
            spike_ms: 3000
      knowledge_planet:
        - type: tool_output_injection
          config:
            injection_text: "[INJECTED]"

      # RAG category (inputs 14-15)
      error_impossible:
        - type: rag_retrieval_corruption
          config:
            corruption_percent: 0.5
      error_ambiguous:
        - type: rag_document_poisoning
          config:
            poison_type: "irrelevant"

      # MCP category (inputs 16-18)
      creative_haiku:
        - type: mcp_tool_latency
          config:
            latency_ms: 2000
        - type: mcp_tool_failure
          config:
            error_code: "TOOL_ERROR"
      multistep_sequence:
        - type: mcp_tool_corruption
          config:
            corruption_type: "schema_violation"
      multistep_conditional:
        - type: mcp_server_unavailable
          config:
            server_name: "primary"
            error_message: "Server connection refused"

    security: false
    timeout_ms: 180000

  security:
    runs: 1
    faults: []
    security: true
    attack_bundles:
      - security_full_eval
    attack_limit: 50
    timeout_ms: 300000

# Full canonical input set (18 inputs)
inputs:
  # Math (2 inputs)
  - id: math_simple
    text: "What is 15 + 27?"
    category: math
    goal:
      contains: "42"

  - id: math_multiplication
    text: "Calculate 12 times 8."
    category: math
    goal:
      contains: "96"

  # Instruction following (3 inputs)
  - id: instruction_list_3
    text: "List exactly 3 colors. Just the colors, nothing else."
    category: instruction
    goal:
      min_length: 5
      max_length: 100

  - id: instruction_word_count
    text: "Respond with exactly 5 words."
    category: instruction
    goal:
      min_length: 10
      max_length: 50

  - id: instruction_format_json
    text: "Return a JSON object with keys 'name' and 'age'. Use 'Alice' and 30."
    category: instruction
    goal:
      contains_all: ["name", "age", "Alice", "30"]

  # Reasoning (3 inputs)
  - id: reasoning_logic
    text: "If all cats have tails, and Whiskers is a cat, does Whiskers have a tail? Answer yes or no."
    category: reasoning
    goal:
      contains_any: ["yes", "Yes", "YES"]

  - id: reasoning_negation
    text: "Is the following statement true or false: 'A triangle has four sides.' Answer only true or false."
    category: reasoning
    goal:
      contains_any: ["false", "False", "FALSE"]

  - id: reasoning_comparison
    text: "Which is larger: 0.9 or 0.85? Just give the number."
    category: reasoning
    goal:
      contains: "0.9"

  # Text manipulation (3 inputs)
  - id: text_reverse
    text: "Reverse the word 'hello'. Just give the reversed word."
    category: text
    goal:
      contains: "olleh"

  - id: text_uppercase
    text: "Convert 'khaos' to uppercase. Just the result."
    category: text
    goal:
      contains: "KHAOS"

  - id: text_count_letters
    text: "How many letters are in the word 'programming'? Just the number."
    category: text
    goal:
      contains: "11"

  # Knowledge (2 inputs)
  - id: knowledge_capital
    text: "What is the capital of France? Just the city name."
    category: knowledge
    goal:
      contains_any: ["Paris", "paris"]

  - id: knowledge_planet
    text: "How many planets are in our solar system? Just the number."
    category: knowledge
    goal:
      contains: "8"

  # Error handling (2 inputs)
  - id: error_impossible
    text: "What is the square root of negative one in real numbers?"
    category: error
    goal:
      contains_any: ["undefined", "not possible", "imaginary", "does not exist", "no real", "cannot"]

  - id: error_ambiguous
    text: "Explain 'it' briefly."
    category: error
    goal:
      min_length: 20

  # Creative (1 input)
  - id: creative_haiku
    text: "Write a haiku about technology. Just the haiku."
    category: creative
    goal:
      min_length: 20
      max_length: 200

  # Multi-step (2 inputs)
  - id: multistep_sequence
    text: "Start with 5, add 3, then multiply by 2. What is the result?"
    category: multistep
    goal:
      contains: "16"

  - id: multistep_conditional
    text: "If 10 is greater than 5, say 'yes'. Otherwise say 'no'. Just one word."
    category: multistep
    goal:
      contains_any: ["yes", "Yes"]
