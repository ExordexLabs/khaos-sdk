# Reusable Khaos Test Workflow
# Users can call this from their repos to run Khaos chaos tests
name: Khaos Test

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version to use'
        required: false
        default: '3.11'
        type: string
      agent-path:
        description: 'Path to the agent to test'
        required: true
        type: string
      scenarios:
        description: 'Comma-separated list of scenario IDs to run'
        required: false
        default: ''
        type: string
      scenario-file:
        description: 'Path to scenario file or directory'
        required: false
        default: ''
        type: string
      config-file:
        description: 'Path to Khaos config file'
        required: false
        default: 'khaos.yaml'
        type: string
      fail-on:
        description: 'When to fail: "any", "critical", "none"'
        required: false
        default: 'critical'
        type: string
      reliability-threshold:
        description: 'Minimum reliability score (0.0-1.0)'
        required: false
        default: '0.8'
        type: string
      runs:
        description: 'Number of runs per scenario'
        required: false
        default: '1'
        type: string
      parallel:
        description: 'Number of parallel workers'
        required: false
        default: '1'
        type: string
      upload-results:
        description: 'Upload results as artifacts'
        required: false
        default: 'true'
        type: string
    secrets:
      KHAOS_API_TOKEN:
        description: 'Khaos Cloud API token for result sync'
        required: false
      OPENAI_API_KEY:
        description: 'OpenAI API key for LLM-based evaluation'
        required: false
      ANTHROPIC_API_KEY:
        description: 'Anthropic API key for LLM-based evaluation'
        required: false
    outputs:
      reliability-score:
        description: 'Overall reliability score'
        value: ${{ jobs.test.outputs.reliability-score }}
      passed:
        description: 'Whether all tests passed'
        value: ${{ jobs.test.outputs.passed }}
      results-path:
        description: 'Path to results file'
        value: ${{ jobs.test.outputs.results-path }}

jobs:
  test:
    name: Run Khaos Tests
    runs-on: ubuntu-latest
    outputs:
      reliability-score: ${{ steps.run.outputs.reliability-score }}
      passed: ${{ steps.run.outputs.passed }}
      results-path: ${{ steps.run.outputs.results-path }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ inputs.python-version }}

      - name: Install Khaos
        run: uv pip install khaos-agent

      - name: Validate configuration
        run: |
          if [ -f "${{ inputs.config-file }}" ]; then
            echo "Using config file: ${{ inputs.config-file }}"
          else
            echo "No config file found, using defaults"
          fi

      - name: Run Khaos tests
        id: run
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          KHAOS_API_TOKEN: ${{ secrets.KHAOS_API_TOKEN }}
        run: |
          set +e

          # Build command safely as an argv array.
          CMD=(uv run khaos run "${{ inputs.agent-path }}")

          # Add scenarios
          if [ -n "${{ inputs.scenarios }}" ]; then
            IFS=',' read -r -a SCENARIOS <<< "${{ inputs.scenarios }}"
            for scenario in "${SCENARIOS[@]}"; do
              scenario="$(echo "$scenario" | xargs)"
              if [ -n "$scenario" ]; then
                CMD+=(--scenario "$scenario")
              fi
            done
          fi

          # Add scenario file/directory
          if [ -n "${{ inputs.scenario-file }}" ]; then
            CMD+=(--scenario-file "${{ inputs.scenario-file }}")
          fi

          # Add options
          CMD+=(--runs "${{ inputs.runs }}")
          CMD+=(--parallel "${{ inputs.parallel }}")
          CMD+=(--output json)
          CMD+=(--output-file khaos-results.json)

          printf 'Running:'
          printf ' %q' "${CMD[@]}"
          printf '\n'
          "${CMD[@]}"
          EXIT_CODE=$?

          # Parse results
          if [ -f "khaos-results.json" ]; then
            THRESHOLD="${{ inputs.reliability-threshold }}"
            RELIABILITY=$(python -c "import json; print(float(json.load(open('khaos-results.json', 'r', encoding='utf-8')).get('reliability_score') or 0.0))")
            PASSED=$(THRESHOLD="$THRESHOLD" RELIABILITY="$RELIABILITY" python -c "import os; print('true' if float(os.environ['RELIABILITY']) >= float(os.environ.get('THRESHOLD', '0.8')) else 'false')")
            echo "reliability-score=$RELIABILITY" >> "$GITHUB_OUTPUT"
            echo "results-path=khaos-results.json" >> "$GITHUB_OUTPUT"
            echo "passed=$PASSED" >> "$GITHUB_OUTPUT"

            if [ "$PASSED" != "true" ] && [ "${{ inputs.fail-on }}" != "none" ]; then
              EXIT_CODE=1
            fi
          else
            echo "reliability-score=0" >> $GITHUB_OUTPUT
            echo "passed=false" >> $GITHUB_OUTPUT
            echo "results-path=" >> $GITHUB_OUTPUT
          fi

          exit $EXIT_CODE

      - name: Generate summary
        if: always()
        env:
          THRESHOLD: ${{ inputs.reliability-threshold }}
          PASSED: ${{ steps.run.outputs.passed }}
        run: |
          echo "## Khaos Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "khaos-results.json" ]; then
            RELIABILITY=$(python -c "import json; print(float(json.load(open('khaos-results.json', 'r', encoding='utf-8')).get('reliability_score') or 0.0))")
            TOTAL=$(python -c "import json; print(int(json.load(open('khaos-results.json', 'r', encoding='utf-8')).get('total_runs') or 0))")
            PASSED_RUNS=$(python -c "import json; print(int(json.load(open('khaos-results.json', 'r', encoding='utf-8')).get('passed_runs') or 0))")
            FAILED_RUNS=$(python -c "import json; print(int(json.load(open('khaos-results.json', 'r', encoding='utf-8')).get('failed_runs') or 0))")

            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Reliability Score | **${RELIABILITY}** |" >> $GITHUB_STEP_SUMMARY
            echo "| Total Runs | ${TOTAL} |" >> $GITHUB_STEP_SUMMARY
            echo "| Passed | ${PASSED_RUNS} |" >> $GITHUB_STEP_SUMMARY
            echo "| Failed | ${FAILED_RUNS} |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            if [ "${PASSED}" == "true" ]; then
              echo ":white_check_mark: **All reliability thresholds met**" >> $GITHUB_STEP_SUMMARY
            else
              echo ":x: **Reliability below threshold (${THRESHOLD})**" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo ":warning: No results file generated" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload results
        if: inputs.upload-results == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: khaos-results
          path: |
            khaos-results.json
            .khaos/
          if-no-files-found: ignore

      - name: Sync to Khaos Cloud
        if: secrets.KHAOS_API_TOKEN != '' && always()
        env:
          KHAOS_API_TOKEN: ${{ secrets.KHAOS_API_TOKEN }}
        run: |
          if [ -f "khaos-results.json" ]; then
            uv run khaos sync --file khaos-results.json || true
          fi
